name: Calculator read-only input browser baseline
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/calculator-input-browser-baseline-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: calculator-readonly-input-baseline
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require successful CI for the exact trusted host source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/runs/40497729877',{method:'GET',redirect:'error',signal:AbortSignal.timeout(10000),headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});assert.equal(r.status,200);const d=await r.json();assert.equal(d.head_sha,'a78fcb46ac2c2ab3419174741d99a40b3c179db2');assert.equal(d.run_attempt,1);assert.equal(d.status,'completed');assert.equal(d.conclusion,'success');
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'a78fcb46ac2c2ab3419174741d99a40b3c179db2'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Transform trusted modules without installing dependencies
        run: |
          node --input-type=module - <<'JS'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';import {stripTypeScriptTypes} from 'node:module';function compile(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())compile(p);else if(p.endsWith('.ts')&&!p.endsWith('.test.ts'))writeFileSync(p.replace(/\.ts$/,'.js'),stripTypeScriptTypes(readFileSync(p,'utf8'),{mode:'transform'}));}}for(const dir of ['agents','commander','config','github','orchestration'])compile(dir);
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erman-ksv/Onay-Factory-Calculator
          ref: '558993981c9bbb7c6100c8335860ac5668768314'
          path: calculator-candidate
          persist-credentials: false
      - name: Prepare immutable Chromium image
        run: docker pull 'mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a'
      - name: Reproduce input defects in isolated Chrome without modifying the app
        run: node scripts/calculator-input-browser-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-input-browser-baseline
          path: ${{ runner.temp }}/calculator-input-browser-baseline.json
          if-no-files-found: error
          retention-days: 7
