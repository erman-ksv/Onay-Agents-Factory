name: Diagnose exact zero-model T04 state restoration
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/t04-state-diagnosis.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5f23cf1a2eb279ba58511f362d8ef94d3a3a753b
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12580123252'
          run-id: '40145096490'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t04-stopped
          merge-multiple: true
      - name: Inspect only state identity metadata; no code or model keys
        env:
          ROOT: ${{ runner.temp }}/t04-stopped
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {existsSync,readdirSync,readFileSync} from 'node:fs';import {createHash} from 'node:crypto';import {join} from 'node:path';
          const root=process.env.ROOT,report=JSON.parse(readFileSync(root+'/report.json'));assert.equal(report.newModelCalls,0);assert.equal(report.remoteBarrierClaimed,false);const state=join(root,'state');
          const files=existsSync(state)?readdirSync(state).map(p=>{const b=readFileSync(join(state,p));let j={};try{j=JSON.parse(b);}catch{}return {path:p,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex'),version:j.version,fingerprint:j.fingerprint,requestKeys:j.request?Object.keys(j.request):[],goalId:j.request?.id,status:j.status};}):[];
          console.log(JSON.stringify({version:1,stateExists:existsSync(state),sourceExists:existsSync(root+'/source/historical/qualified-manifest.json'),files,reportPhase:report.reason,modelCalls:0}));
          JS

      - name: Reproduce only store inspection with exact authenticated state
        env:
          ROOT: ${{ runner.temp }}/t04-stopped
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
        run: |
          cat > scripts/t04-state-store-diagnosis.mjs <<'JS'
          import {readFileSync,chmodSync,statSync,readdirSync} from 'node:fs';import {CalculatorPlanStore} from '../orchestration/calculatorPlanStore.js';import {prepareCalculatorGoal,createCalculatorPlan} from '../orchestration/calculatorPlan.js';
          let phase='read_fixture';try{const fixture=JSON.parse(readFileSync('orchestration/fixtures/calculatorStep7SavedPlan.json'));phase='read_document';const root=process.env.ROOT+'/state',doc=JSON.parse(readFileSync(root+'/calculator-pilot-step7-v1.calculator-plan.json'));console.log(JSON.stringify({fixtureOwner:prepareCalculatorGoal(fixture.request).ownerFingerprint,documentOwner:prepareCalculatorGoal(doc.request).ownerFingerprint,fixturePlan:createCalculatorPlan(fixture.request,fixture.proposal).fingerprint,documentPlan:createCalculatorPlan(doc.request,doc.proposal).fingerprint,sameRequest:JSON.stringify(fixture.request)===JSON.stringify(doc.request),mode:statSync(root).mode&511}));phase='normalize_download_modes';chmodSync(root,448);for(const p of readdirSync(root))chmodSync(root+'/'+p,384);phase='construct_store';const store=new CalculatorPlanStore(root,fixture.request);phase='inspect_store';const plan=store.inspect();console.log(JSON.stringify({phase,status:'store-inspection-passed',planFingerprint:plan?.fingerprint,taskCount:plan?.tasks.length}));}catch(e){console.log(JSON.stringify({phase,errorName:e?.name,errorCode:e?.code,errorMessage:String(e?.message).slice(0,180)}));process.exitCode=1;}
          JS
          pnpm exec tsx scripts/t04-state-store-diagnosis.mjs
