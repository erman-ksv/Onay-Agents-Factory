           once.recordStage('qualify_saved_t02',result.status==='blocked'?'blocked':'passed');once.finish(result.status==='blocked'?'blocked':'needs-review','qualified_t02_consumed_no_replay');
           console.log(JSON.stringify({...result,newCharge:charge,aggregateT02Charge:total,oldApprovalsTransferred:false,modelGenerationRepeated:false}));if(result.status==='blocked')process.exitCode=10;
