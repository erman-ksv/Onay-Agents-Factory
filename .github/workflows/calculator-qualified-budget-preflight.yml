             cap=await collectCalculatorAssessmentEvidence(task,changes,coreSnapshot,{checkProposal:checks.checkProposal,checkBrowser:async (input:any)=>{assert.equal(input.proposalDigest,DIGEST);assert.equal(input.dependencySha256,admission.dependencySha256);return {repository:changes.repository,taskId:TASK,baseSha:BASE,proposalDigest:DIGEST,dependencySha256:admission.dependencySha256,status:'passed',testsExecuted:true,browser:browser.browser,sandboxDisabled:false,pageErrors:0,blockedRequests:0,scenarios:browser.steps.map((s:any)=>s.scenario)};}});return changes;},
            checkpoint:(event:any)=>{assert.equal(event.taskId,TASK);const inFlight=active.httpInFlight;save({attempt:event.attempt,stage:event.stage,status:event.status,...(event.proposal?{proposal:event.proposal}:{}),assessments:event.assessments,modelState:active.modelState,publicationStarted:event.publicationStarted,httpInFlight:event.status==='passed'?false:inFlight},team.checkpointCharge());},
           });
           const charge=team.checkpointCharge();assert.ok(charge.attemptedRequests<=3);const total=Object.fromEntries(Object.keys(carried).map(k=>[k,carried[k]+charge[k]]));
