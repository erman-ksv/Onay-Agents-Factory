name: Calculator exact corrected t02 packet budget preflight
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.factory/calculator-qualified-budget-preflight-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: calculator-one-cycle
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/calculator-qualified-budget-preflight-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b58e862d34e49902f5686242a48b96ab730516c
          path: runtime
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked host dependencies in the fresh Actions worker
        working-directory: runtime
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12415777866'
          run-id: 39756457942
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-qualified-review/prior-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12418090626'
          run-id: 39760227668
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-qualified-review/repaired-evidence
          merge-multiple: true
