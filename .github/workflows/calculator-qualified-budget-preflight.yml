           function save(payload:any,charge:any){assert.equal(poisoned,false);try{const next={...payload,modelState:{...charge,elapsedMs:Math.ceil(charge.elapsedMs)}};writers.get(TASK).save(next);active=next;}catch(e){poisoned=true;throw e;}}
