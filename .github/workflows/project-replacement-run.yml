name: Stage8 OWNER-pinned bounded corrective acceptance
on:
  push:
    branches: ['fix/stage8-corrective-verification-20261029']
    paths: ['.factory/replacement-host.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: factory-bounded-oss-replacement
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'fe971f092b68a7894d580c8ae73b2a93b2c7f3c9'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: activation-config
          sparse-checkout: .factory/replacement-host.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Confirm exact source and full CI before exposing recovery or provider credentials
        env:
          FACTORY_CI_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('/usr/bin/git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'fe971f092b68a7894d580c8ae73b2a93b2c7f3c9');
          for(const key of ['GROQ_API_KEY','FACTORY_RECOVERY_KEY_BASE64','CALCULATOR_GITHUB_TOKEN','AGENT_FACTORY_PROJECT_LIVE_APPROVED','AGENT_FACTORY_ENABLE_GITHUB_WRITES'])assert.equal(process.env[key],undefined);
          const read=async url=>{const r=await fetch(url,{method:'GET',redirect:'error',signal:AbortSignal.timeout(10000),headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.FACTORY_CI_READ_TOKEN}});assert.equal(r.status,200);assert.equal(r.headers.get('link'),null);return r.json();};
          const base='https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/runs/41027851783',r=await read(base);
          assert.equal(r.head_sha,'fe971f092b68a7894d580c8ae73b2a93b2c7f3c9');assert.equal(r.run_attempt,1);assert.equal(r.status,'completed');assert.equal(r.conclusion,'success');assert.equal(r.name,'Agent Factory CI');assert.equal(r.event,'push');assert.equal(r.head_branch,'fix/stage8-corrective-verification-20261029');
          const jobs=await read(base+'/attempts/1/jobs?per_page=20');assert.equal(jobs.total_count,1);assert.equal(jobs.jobs.length,1);const job=jobs.jobs[0];assert.equal(job.id,123970150339);assert.equal(job.head_sha,r.head_sha);assert.equal(job.conclusion,'success');
          for(const name of ['Install','Typecheck','Test']){const steps=job.steps.filter(s=>s.name===name);assert.equal(steps.length,1);assert.equal(steps[0].status,'completed');assert.equal(steps[0].conclusion,'success');}
          JS
      - name: Verify independently reviewed host pin and compile immutable source
        env:
          EXPECTED_REPLACEMENT_SCOPE_SHA256: '8296daaee570fbc1e4a6ba1dc9f299fb42ea6d7d638fdc203aa4b846d99d2619'
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';import {join} from 'node:path';import {stripTypeScriptTypes} from 'node:module';
          const expected=process.env.EXPECTED_REPLACEMENT_SCOPE_SHA256;assert.match(expected,/^[a-f0-9]{64}$/);const bytes=readFileSync('activation-config/.factory/replacement-host.json');assert.equal(createHash('sha256').update(bytes).digest('hex'),expected);writeFileSync('.factory/replacement-host.json',bytes);
          function compile(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())compile(p);else if(p.endsWith('.ts')&&!p.endsWith('.test.ts'))writeFileSync(p.replace(/\.ts$/,'.js'),stripTypeScriptTypes(readFileSync(p,'utf8'),{mode:'transform'}));}}for(const dir of ['agents','commander','config','github','orchestration'])compile(dir);
          const {prepareProjectReplacementHost}=await import('./orchestration/projectReplacementRecoveryHost.js');prepareProjectReplacementHost(bytes.toString('utf8'),expected,readFileSync('.factory/runtime-project-manifest.json','utf8'));
          JS
      - name: Verify entrypoint refusal before exposing credentials
        run: node scripts/project-replacement-recovery.test.mjs
      - name: Prepare independently pinned Node and browser images
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';
          const v=JSON.parse(readFileSync('.factory/runtime-project-manifest.json','utf8')),images=[...new Set(v.taskPolicies.flatMap(p=>[p.node.image,...(p.browser?[p.browser.image]:[])]))];assert.ok(images.length<=8);for(const image of images){assert.match(image,/^(?:node|mcr\.microsoft\.com\/playwright)@sha256:[a-f0-9]{64}$/);execFileSync('/usr/bin/docker',['pull',image],{stdio:'inherit',timeout:120000,env:{PATH:'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'}});}
          JS
      - name: Run exactly one separately approved OSS replacement
        env:
          EXPECTED_REPLACEMENT_SCOPE_SHA256: '8296daaee570fbc1e4a6ba1dc9f299fb42ea6d7d638fdc203aa4b846d99d2619'
          FACTORY_REPLACEMENT_MODE: 'run'
          FACTORY_STATE_TOKEN: ${{ github.token }}
          FACTORY_READ_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          FACTORY_RECOVERY_KEY_BASE64: ${{ secrets.FACTORY_RECOVERY_KEY_BASE64 }}
          FACTORY_RECOVERY_KEY_ID: 'onay-runtime-key-v1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          AGENT_FACTORY_PROVIDER: 'groq'
          ONAY_TEAM_FREE_TIER_CONFIRMED: 'true'
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
          AGENT_FACTORY_ENABLE_GITHUB_WRITES: 'true'
          AGENT_FACTORY_PROJECT_LIVE_APPROVED: 'ONE_FREE_BOUNDED_RUN'
        run: node scripts/project-replacement-recovery.mjs > replacement-run-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8-owner-pinned-result-${{ github.run_id }}
          path: replacement-run-result.json
          if-no-files-found: warn
          retention-days: 7
