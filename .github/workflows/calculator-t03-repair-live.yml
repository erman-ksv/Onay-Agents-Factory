name: Calculator saved t03 repair continuation
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/calculator-t03-repair-request.json']
# Explicit host-only scope: Factory writes only metadata objects and an atomic state reference.
permissions:
  contents: write
  actions: read
concurrency:
  group: calculator-protected-live-plan-step7
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/calculator-t03-repair-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the fixed host request
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const value=JSON.parse(readFileSync('request/.factory/calculator-t03-repair-request.json','utf8'));
          assert.deepEqual(value,{"version":1,"runtimeSha":"7e4a08719fb5aa27b9b47e293326cb378248b4c6","sourceCiRunId":39950690154,"taskId":"calculator-pilot-step7-v1-34ee03-t03","sourceRunId":39942417242,"sourceArtifactId":12497425333,"sourceCapsuleSha256":"0f99168fbc2dfa98aad2b378ee4b36a5440e51ac5721d14c2cd8d930707ebbf7","maxNewRequests":4,"maxAdditionalRepairs":0,"automaticReplay":false,"legalEnabled":false,"zeroHttpStopRunId":39949567538,"zeroHttpReportSha256":"9eb221b644b46fedb0376395cb35abfdfedec9e526120fcc5e61e66cb79155ae"});
          JS
      - name: Checkout immutable live runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7e4a08719fb5aa27b9b47e293326cb378248b4c6
          path: runtime
          persist-credentials: false
      - name: Download exact stopped t03 evidence without execution
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12497425333'
          run-id: '39942417242'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-prior
          merge-multiple: true
      - name: Download exact zero-HTTP context-stop proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12499003755'
          run-id: '39949567538'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-context-stop
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install trusted runtime dependencies
        working-directory: runtime
        run: pnpm install --frozen-lockfile
      - name: Prepare exact isolated runtime images
        run: |
          docker --host=unix:///var/run/docker.sock pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
          docker --host=unix:///var/run/docker.sock pull 'mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a'
      - name: Continue the original stopped t03 repair once
        working-directory: runtime
        env:
          CALCULATOR_T03_REPAIR_APPROVED: CONTINUE_ORIGINAL_T03_AFTER_PROVEN_ZERO_HTTP
          CALCULATOR_T03_EVIDENCE_DIRECTORY: ${{ runner.temp }}/calculator-t03-prior
          CALCULATOR_T03_CONTEXT_STOP_DIRECTORY: ${{ runner.temp }}/calculator-t03-context-stop
          FACTORY_RUNTIME_SHA: 7e4a08719fb5aa27b9b47e293326cb378248b4c6
          FACTORY_SOURCE_CI_RUN: '39950690154'
          FACTORY_STATE_TOKEN: ${{ github.token }}
          CALCULATOR_GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CALCULATOR_EXECUTION_LIVE_APPROVED: RUN_ONE_FREE_CALCULATOR_TASK
          CALCULATOR_MODEL_LIVE_APPROVED: ONE_FREE_BOUNDED_RUN
          ONAY_TEAM_FREE_TIER_CONFIRMED: 'true'
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
          AGENT_FACTORY_PROVIDER: groq
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
          AGENT_FACTORY_ALLOW_WORKFLOW_CHANGES: 'false'
          AGENT_FACTORY_ENABLE_GITHUB_WRITES: 'true'
        run: pnpm exec tsx scripts/calculator-t03-repair-live.mjs
      - name: Preserve immutable evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-t03-repair-context-${{ github.run_id }}
          path: ${{ runner.temp }}/calculator-t03-repair-context/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
