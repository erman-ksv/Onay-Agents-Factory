name: Find Skills Manual Smoke (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_ONE_REQUEST to authorize one Cloudflare AI call'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: find-skills-manual-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Cloudflare Find Skills single-request test
    if: ${{ inputs.confirmation == 'RUN_ONE_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENT_FACTORY_PROVIDER: cloudflare
      AGENT_FACTORY_ENABLE_GITHUB_WRITES: 'false'
      AGENT_FACTORY_LEGAL_ENABLED: 'false'
      FIND_SKILLS_LIVE_CONFIRM: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bounded Find Skills read-only smoke
        run: pnpm exec tsx commander/findSkillsManualSmoke.ts
