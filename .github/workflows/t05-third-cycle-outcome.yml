name: Verify third T05 tests and preserve independent review blockers without models
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/t05-third-cycle-outcome.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d639f0c03fc54cbc8b4de626cb8f4ff3c0612714
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12592016488'
          run-id: '40174428096'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t05-third-result
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12590631312'
          run-id: '40171597668'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t05-second-result
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Independently bind corrected bytes, passed tests, actual role verdicts and inherited charge
        env:
          SOURCE_ROOT: ${{ runner.temp }}/t05-third-result
          PREVIOUS_ROOT: ${{ runner.temp }}/t05-second-result
          FACTORY_STATE_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
        run: |
          cat > scripts/t05-third-cycle-outcome.mjs <<'JS'
          import {spawnSync} from 'node:child_process';import assert from 'node:assert/strict';import {readFileSync,readdirSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';import {createCalculatorPlan} from '../orchestration/calculatorPlan.js';import {createCalculatorSnapshotReader,loadCalculatorSnapshot,calculatorSources} from '../github/calculatorSnapshot.js';import {parseCalculatorExecutionCheckpointBytes} from '../orchestration/calculatorExecutionCheckpoint.js';import {prepareCalculatorT05ZeroRecovery} from '../orchestration/calculatorT05ZeroRecovery.js';import {calculatorProposalDigest} from '../orchestration/calculatorExecutionEvidence.js';import {createCalculatorLiveBarrier} from '../orchestration/calculatorLiveBarrier.js';
          assert.equal(process.env.GROQ_API_KEY,undefined);const root=process.env.SOURCE_ROOT,base='eac625e5830612c64fb8dafbd3d239c72adbeafd',sha=b=>createHash('sha256').update(b).digest('hex'),f=JSON.parse(readFileSync('orchestration/fixtures/calculatorStep7SavedPlan.json')),plan=createCalculatorPlan(f.request,f.proposal),task=plan.tasks[4],report=JSON.parse(readFileSync(root+'/report.json'));
          const r=await fetch('https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/artifacts/12592016488',{headers:{Authorization:'Bearer '+process.env.FACTORY_STATE_TOKEN},redirect:'error'});assert.equal(r.status,200);const a=await r.json();assert.equal(a.workflow_run.id,40174428096);assert.equal(a.workflow_run.head_sha,'9fa89ecdb0a3122caa8f00bf41112dcd1a1d03d9');assert.equal(a.digest,'sha256:bb0cf7ae2ec4e5c89574b706b642c0a0f25486ee4921239955fb2a0d77ea8852');assert.equal(a.expired,false);
          const bytes=readFileSync(root+'/execution-private/'+task.id+'.execution.json'),json=JSON.parse(bytes),cap=parseCalculatorExecutionCheckpointBytes(bytes,json.identity,sha(bytes)).data,p=cap.payload;assert.equal(cap.identity.taskId,task.id);assert.equal(cap.identity.baseSha,base);assert.equal(cap.identity.planFingerprint,plan.fingerprint);assert.equal(p.assessments.length,3);assert.equal(p.publicationStarted,false);assert.equal(report.currentCharge.attemptedRequests,10);assert.equal(report.currentCharge.reservedRunTokens,38023);assert.equal(report.newModelCalls,4);const digest=calculatorProposalDigest(p.proposal);assert.equal(digest,'f2e8a84624d09752372ccf69ee449919dc4b60e6ff406091d092b4b9fc56706b');
          const reader=createCalculatorSnapshotReader();assert.equal(await reader.getHead(plan.branch),base);const snapshot=await loadCalculatorSnapshot({repository:plan.owner.repository,baseRef:plan.branch,baseSha:base,changePaths:task.paths},reader),original=calculatorSources(snapshot).get('test/ui.test.mjs'),old=JSON.parse(readFileSync(process.env.PREVIOUS_ROOT+'/private-proposal-cc2b77e6af1fb732578b85004a07958fcbf3f8676938728a1185ac0157062032.json'));assert.ok(old.files[0].content.startsWith(original));const suffix=old.files[0].content.slice(original.length);assert.equal(sha(suffix),'bed2a0d72f12693eff0881b3824b5f3b743da8a11c0556176459ee7874083739');const raw=JSON.parse(readFileSync(root+'/private-agent-third-correction.json'));assert.equal(raw.taskId,task.id);const rebuilt=prepareCalculatorT05ZeroRecovery(task,suffix,sha(suffix),raw.result,snapshot);assert.equal(calculatorProposalDigest(rebuilt.changes),digest);assert.equal(rebuilt.changes.files[0].content,p.proposal.files[0].content);
          const node=JSON.parse(readFileSync(root+'/checks-'+digest+'.json')),browser=JSON.parse(readFileSync(root+'/browser-'+digest+'.json'));for(const proof of [node,browser]){assert.equal(proof.proposalDigest,digest);assert.equal(proof.baseSha,base);assert.equal(proof.taskId,task.id);assert.equal(proof.status,'passed');assert.equal(proof.testsExecuted,true);}assert.equal(browser.sandboxDisabled,false);assert.equal(browser.pageErrors,0);assert.equal(browser.blockedRequests,0);
          const syntaxPath=process.env.RUNNER_TEMP+'/t05-exact-proposed-test.mjs';writeFileSync(syntaxPath,p.proposal.files[0].content,{mode:0o600});const syntax=spawnSync(process.execPath,['--check',syntaxPath],{env:{PATH:process.env.PATH},timeout:10000,maxBuffer:8192});assert.equal(syntax.status,0);const actualSourceSyntax={kind:'node-check-exact-proposed-test-module',nodeVersion:process.version,sourceSha256:sha(p.proposal.files[0].content),proposalDigest:digest,exitCode:syntax.status,sourceBytes:Buffer.byteLength(p.proposal.files[0].content),adjacentTestBoundaries:(p.proposal.files[0].content.match(/\}\);(?=[ \t]*test\s*\()/g)||[]).length,executesApplicationCode:false};
          const compared=[];for(const name of readdirSync(process.env.PREVIOUS_ROOT+'/state').filter(p=>p.endsWith('.json'))){assert.equal(sha(readFileSync(root+'/state/'+name)),sha(readFileSync(process.env.PREVIOUS_ROOT+'/state/'+name)));compared.push(name);}assert.equal(compared.length,7);const barrier=createCalculatorLiveBarrier({runtimeSha:'d639f0c03fc54cbc8b4de626cb8f4ff3c0612714',sourceCiRunId:40174280123,planFingerprint:plan.fingerprint,previousTaskId:plan.tasks[3].id+'-t05-zero3',candidateSha:base},process.env);assert.equal(await barrier.inspectAbsent(),false);
          const result={version:1,status:'t05-third-correction-tests-passed-independent-review-blocked',sourceRunId:40174428096,sourceArtifactId:12592016488,sourceCapsuleSha256:sha(bytes),taskId:task.id,baseSha:base,proposalDigest:digest,assessments:p.assessments,actualSourceSyntax,reviewerSyntaxClaimContradictedByParser:true,actualNodeChecks:node,actualBrowserChecks:browser,targetedCorrection:report.targetedCorrection,agentReplacementTest:raw.result.replacementTest,originalFilePreserved:true,precedingGeneratedTestsPreserved:true,followingGeneratedTestsPreserved:true,currentCharge:report.currentCharge,remainingRequests:0,remainingReservedTokens:9977,totalCodeCorrectionsConsumed:3,historicalReceiptsCompared:compared,duplicateRefused:true,executionBarrier:barrier.ref,publicationStarted:false,calculatorUnchanged:true,modelCalls:0,writes:0,legalEnabled:false};writeFileSync(process.env.RUNNER_TEMP+'/t05-third-cycle-outcome.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          JS
          pnpm exec tsx scripts/t05-third-cycle-outcome.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t05-third-cycle-outcome-${{ github.run_id }}
          path: ${{ runner.temp }}/t05-third-cycle-outcome.json
          if-no-files-found: ignore
          retention-days: 14
