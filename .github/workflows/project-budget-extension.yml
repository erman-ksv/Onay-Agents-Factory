name: Inspect or owner-authorize project budget extension without reset
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/project-budget-extension-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: project-budget-extension-operator
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      operation: ${{ steps.validate.outputs.operation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .factory/project-budget-extension-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: validate
        name: Validate only a fixed inspect or owner-bound extension operation
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {readFileSync,appendFileSync} from 'node:fs';const b=readFileSync('.factory/project-budget-extension-request.json');assert.ok(b.length<=8192);const r=JSON.parse(b);
          assert.deepEqual(Object.keys(r).sort(),['expectedRevision','expectedStateSha256','operation','ownerDecision','previousDecision','version']);assert.equal(r.version,1);assert.ok(['inspect','extend'].includes(r.operation));for(const k of ['expectedRevision','expectedStateSha256'])assert.match(r[k],/^[a-f0-9]{64}$/);
          function decision(d){assert.ok(d&&typeof d==='object'&&!Array.isArray(d));assert.deepEqual(Object.keys(d).sort(),['bodySha256','commentId','issueNumber']);assert.equal(d.issueNumber,75);assert.ok(Number.isSafeInteger(d.commentId)&&d.commentId>0);assert.match(d.bodySha256,/^[a-f0-9]{64}$/);}decision(r.previousDecision);if(r.operation==='inspect')assert.equal(r.ownerDecision,null);else{decision(r.ownerDecision);assert.notEqual(r.ownerDecision.commentId,r.previousDecision.commentId);}
          appendFileSync(process.env.GITHUB_OUTPUT,'operation='+r.operation+'\n');
          JS
  inspect:
    needs: request
    if: needs.request.outputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable tested operator and proposed document
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'b1d7f906517fdedf959b23f8f8503294a626b9dd'
          path: runtime
          persist-credentials: false
      - name: Checkout exact event request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/project-budget-extension-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Transform checked modules without package installation
        working-directory: runtime
        run: |
          node --input-type=module - <<'JS'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';import {stripTypeScriptTypes} from 'node:module';
          function compile(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())compile(p);else if(p.endsWith('.ts')&&!p.endsWith('.test.ts'))writeFileSync(p.replace(/\.ts$/,'.js'),stripTypeScriptTypes(readFileSync(p,'utf8'),{mode:'transform'}));}}
          for(const dir of ['agents','commander','config','github','orchestration'])compile(dir);
          JS
      - name: Inspect existing owner, state and inactive extension; no writer or model permission
        working-directory: runtime
        env:
          FACTORY_EXTENSION_OPERATION: 'inspect'
          FACTORY_EXTENSION_TOKEN: ${{ github.token }}
          FACTORY_RUNTIME_SHA: 'b1d7f906517fdedf959b23f8f8503294a626b9dd'
          FACTORY_SOURCE_CI_RUN: '40303983534'
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
        run: node scripts/project-budget-extension.mjs
      - name: Preserve source-free result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-budget-extension-inspect-${{ github.run_id }}
          path: ${{ runner.temp }}/project-budget-extension/result.json
          if-no-files-found: warn
          retention-days: 7
  extend:
    needs: request
    if: needs.request.outputs.operation == 'extend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout immutable tested operator and proposed document
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'b1d7f906517fdedf959b23f8f8503294a626b9dd'
          path: runtime
          persist-credentials: false
      - name: Checkout exact event request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/project-budget-extension-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Transform checked modules without package installation
        working-directory: runtime
        run: |
          node --input-type=module - <<'JS'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';import {stripTypeScriptTypes} from 'node:module';
          function compile(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())compile(p);else if(p.endsWith('.ts')&&!p.endsWith('.test.ts'))writeFileSync(p.replace(/\.ts$/,'.js'),stripTypeScriptTypes(readFileSync(p,'utf8'),{mode:'transform'}));}}
          for(const dir of ['agents','commander','config','github','orchestration'])compile(dir);
          JS
      - name: Verify two native owner decisions and preserve every prior reservation before atomic extension
        working-directory: runtime
        env:
          FACTORY_EXTENSION_OPERATION: 'extend'
          FACTORY_EXTENSION_TOKEN: ${{ github.token }}
          FACTORY_RUNTIME_SHA: 'b1d7f906517fdedf959b23f8f8503294a626b9dd'
          FACTORY_SOURCE_CI_RUN: '40303983534'
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
        run: node scripts/project-budget-extension.mjs
      - name: Preserve source-free result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-budget-extension-extend-${{ github.run_id }}
          path: ${{ runner.temp }}/project-budget-extension/result.json
          if-no-files-found: warn
          retention-days: 7
