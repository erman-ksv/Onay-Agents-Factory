name: Calculator continuation result read-only audit
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.github/workflows/calculator-continuation-result-audit.yml', 'scripts/calculator-continuation-result-audit.mjs']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout only the reviewed read-only audit script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/calculator-continuation-result-audit.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact immutable artifact provenance without model credentials
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const endpoint = 'https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/artifacts/12334546968';
            if (process.env.GITHUB_REPOSITORY !== 'erman-ksv/Onay-Agents-Factory' || !process.env.AUDIT_GITHUB_TOKEN) throw Error();
            const response = await fetch(endpoint, { method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
              headers: { Authorization: 'Bearer ' + process.env.AUDIT_GITHUB_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
            if (!response.ok || !response.body) throw Error();
            const reader = response.body.getReader(), chunks = []; let bytes = 0;
            try { while (true) { const part = await reader.read(); if (part.done) break; bytes += part.value.byteLength;
              if (bytes > 65536) { await reader.cancel(); throw Error(); } chunks.push(part.value); } }
            finally { reader.releaseLock(); }
            const artifact = JSON.parse(Buffer.concat(chunks).toString('utf8'));
            if (artifact.id !== 12334546968 || artifact.name !== 'calculator-step7-continuation-evidence-39576151385' || artifact.url !== endpoint || artifact.expired !== false ||
                artifact.digest !== 'sha256:cffa995e7563da50f4797bf05ac132916f211b2eec41183ebfb298ef6149b132' ||
                !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes < 1 || artifact.size_in_bytes > 8388608 ||
                artifact.workflow_run?.id !== 39576151385 || artifact.workflow_run?.head_sha !== 'beac1cd85f762f0073eaf5aa6ff3ff7c6d1c1d11' ||
                artifact.workflow_run?.head_branch !== 'feat/calculator-step7-regeneration-20261020') throw Error();
          } catch { console.error('Fixed continuation artifact provenance unverified; no replay.'); process.exitCode = 10; }
          NODE
      - name: Download only the fixed private evidence artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12334546968'
          run-id: 39576151385
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current-continuation-result-audit
          merge-multiple: true
      - name: Verify all bytes and print only source-free execution evidence
        run: node scripts/calculator-continuation-result-audit.mjs "$RUNNER_TEMP/current-continuation-result-audit"
