name: Verify T04 completion and deliver exact CI without model replay
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/t04-verified-completion.json']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      artifact_id: ${{ steps.audit.outputs.artifact-id }}
      artifact_digest: ${{ steps.audit.outputs.artifact-digest }}
