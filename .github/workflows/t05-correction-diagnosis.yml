name: Inspect saved T05 correction without models or writes
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/t05-correction-diagnosis.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e1a46b2bf733ae1a03c73e63c72a39aa023d4777
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12581564613'
          run-id: '40150387309'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t05-stopped-correction
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Inspect source-free diagnostics and both consumed claims
        env:
          SOURCE_ROOT: ${{ runner.temp }}/t05-stopped-correction
          GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          FACTORY_STATE_TOKEN: ${{ github.token }}
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
        run: |
          cat > scripts/t05-correction-diagnosis.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createCalculatorPlan} from '../orchestration/calculatorPlan.js';
          import {createCalculatorSnapshotReader,loadCalculatorSnapshot} from '../github/calculatorSnapshot.js';
          import {calculatorProposalDiagnostics} from '../orchestration/calculatorProposalDiagnostics.js';
          import {prepareCalculatorRoleChanges} from '../commander/calculatorTeam.js';
          import {calculatorProposalDigest} from '../orchestration/calculatorExecutionEvidence.js';
          import {createCalculatorModelTeam} from '../orchestration/calculatorModelTeam.js';
          import {createCalculatorLiveBarrier} from '../orchestration/calculatorLiveBarrier.js';
          assert.equal(process.env.GROQ_API_KEY,undefined);
          const base='eac625e5830612c64fb8dafbd3d239c72adbeafd',fixture=JSON.parse(readFileSync('orchestration/fixtures/calculatorStep7SavedPlan.json')),plan=createCalculatorPlan(fixture.request,fixture.proposal),task=plan.tasks[4],reader=createCalculatorSnapshotReader(),root=process.env.SOURCE_ROOT,report=JSON.parse(readFileSync(root+'/report.json'));
          const res=await fetch('https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/artifacts/12581564613',{headers:{Authorization:'Bearer '+process.env.FACTORY_STATE_TOKEN},redirect:'error'});assert.equal(res.status,200);const artifact=await res.json();assert.equal(artifact.workflow_run.id,40150387309);assert.equal(artifact.workflow_run.head_sha,'9723f88d310ef192da7fb8955f8f59240e5c5f49');assert.equal(artifact.digest,'sha256:1534bb848f3430a68241a1b6d08f7568b54733b4a9f923271ca6f0f25edc378c');assert.equal(artifact.expired,false);
          assert.equal(report.currentCharge.attemptedRequests,2);assert.equal(report.correctionConsumed,true);assert.equal(report.lastCheckpoint.publicationStarted,false);assert.equal(await reader.getHead(plan.branch),base);
          const saved=JSON.parse(readFileSync(root+'/private-agent-correction.json'));assert.equal(saved.taskId,task.id);
          const snapshot=await loadCalculatorSnapshot({repository:plan.owner.repository,baseRef:plan.branch,baseSha:base,changePaths:task.paths},reader),raw=saved.result,diagnostics=calculatorProposalDiagnostics(raw,snapshot);let prepared=false,restored=false,phase='proposal_validation';
          try{const proposal=prepareCalculatorRoleChanges('frontend',raw,snapshot);prepared=true;phase='proposal_restore';const team=createCalculatorModelTeam(plan.request,{AGENT_FACTORY_TARGET_PROFILE:'calculator',AGENT_FACTORY_PROVIDER:'groq',GROQ_API_KEY:'offline-not-a-real-key',CALCULATOR_MODEL_LIVE_APPROVED:'ONE_FREE_BOUNDED_RUN',ONAY_TEAM_FREE_TIER_CONFIRMED:'true',AGENT_FACTORY_LEGAL_ENABLED:'false'},async()=>{throw Error('Transport forbidden');});team.restoreProposal(plan,task.id,snapshot,proposal,calculatorProposalDigest(proposal),[]);restored=true;phase='restored_without_model';assert.equal(team.checkpointCharge().attemptedRequests,0);}catch{/* Source-free diagnostic only. */}
          const claims=[];
          for(const [runtimeSha,sourceCiRunId,suffix]of [['74e021f9257be53ded32c90fdd29369c19fd9b23',40149959287,'-t05-exec'],['e1a46b2bf733ae1a03c73e63c72a39aa023d4777',40150271565,'-t05-fix1']]){const b=createCalculatorLiveBarrier({runtimeSha,sourceCiRunId,planFingerprint:plan.fingerprint,previousTaskId:plan.tasks[3].id+suffix,candidateSha:base},process.env);assert.equal(await b.inspectAbsent(),false);claims.push({ref:b.ref,duplicateRefused:true,modelCalls:0});}
          const result={version:1,status:'saved-t05-correction-inspected-readonly',taskId:task.id,baseSha:base,sourceRunId:40150387309,sourceArtifactId:12581564613,rawSha256:createHash('sha256').update(JSON.stringify(raw)).digest('hex'),topLevelFields:Object.keys(raw).sort(),changeMetadata:Array.isArray(raw.changes)?raw.changes.map(c=>({operation:c.operation,path:task.paths.includes(c.path)?c.path:'unapproved',fields:Object.keys(c).sort(),edits:Array.isArray(c.edits)?c.edits.map(e=>({fields:Object.keys(e).sort(),beforeLength:typeof e.before==='string'?e.before.length:null,afterLength:typeof e.after==='string'?e.after.length:null})):undefined})):[],proposalDiagnostics:diagnostics,prepared,restored,phase,currentCharge:report.currentCharge,remainingRequests:8-report.currentCharge.attemptedRequests,remainingReservedTokens:48000-report.currentCharge.reservedRunTokens,correctionConsumed:true,claims,modelCalls:0,writes:0,legalEnabled:false};
          writeFileSync(process.env.RUNNER_TEMP+'/t05-correction-diagnosis.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          JS
          pnpm exec tsx scripts/t05-correction-diagnosis.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t05-correction-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/t05-correction-diagnosis.json
          if-no-files-found: ignore
          retention-days: 14
