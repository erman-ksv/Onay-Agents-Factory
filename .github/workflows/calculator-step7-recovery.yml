name: Calculator one reviewed step-7 recovery
on:
  push:
    branches: ['feat/onay-task-runner-20261019']
    paths: ['.factory/calculator-step7-recovery-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: calculator-one-cycle
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only reviewed owner recovery request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/calculator-step7-recovery-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout immutable reviewed recovery runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4fcdf994f42d204fa6e5f65b1dc1fa52ea5d8ad2
          path: runtime
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked trusted runtime on Actions
        working-directory: runtime
        run: pnpm install --frozen-lockfile
      - name: Restore fixed failed capsule without changing the old artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12272791735'
          run-id: 39437299742
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-step7-recovery/prior-capsule
          merge-multiple: true
      - name: Restore fixed old barrier
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12272402010'
          run-id: 39437299742
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-step7-recovery/prior-barrier
          merge-multiple: true
      - name: Verify one-use history, exact old evidence and conservative prior charge
        working-directory: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx orchestration/calculatorStep7Recovery.ts prepare "$RUNNER_TEMP/calculator-step7-recovery" '4fcdf994f42d204fa6e5f65b1dc1fa52ea5d8ad2'
      - name: Persist immutable remote recovery barrier before inference or writes
        uses: actions/upload-artifact@v4
        with:
          name: calculator-step7-recovery-barrier-${{ github.run_id }}
          path: ${{ runner.temp }}/calculator-step7-recovery/barrier/recovery.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Prepare original exact sandbox image
        run: docker --host=unix:///var/run/docker.sock pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
      - name: Recover planning once and attempt exactly one task with all original gates
        working-directory: runtime
        env:
          CALCULATOR_RECOVERY_BARRIER_UPLOADED: 'true'
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
          AGENT_FACTORY_PROVIDER: groq
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
          AGENT_FACTORY_ALLOW_WORKFLOW_CHANGES: 'false'
          ONAY_TEAM_FREE_TIER_CONFIRMED: 'true'
          CALCULATOR_MODEL_LIVE_APPROVED: ONE_FREE_BOUNDED_RUN
          CALCULATOR_EXECUTION_LIVE_APPROVED: RUN_ONE_FREE_CALCULATOR_TASK
          AGENT_FACTORY_ENABLE_GITHUB_WRITES: 'true'
          GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm exec tsx orchestration/calculatorStep7Recovery.ts execute "$RUNNER_TEMP/calculator-step7-recovery" '4fcdf994f42d204fa6e5f65b1dc1fa52ea5d8ad2'
      - name: Preserve all prior and recovery receipts even after refusal
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: calculator-step7-recovery-state-${{ github.run_id }}
          path: ${{ runner.temp }}/calculator-step7-recovery/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
