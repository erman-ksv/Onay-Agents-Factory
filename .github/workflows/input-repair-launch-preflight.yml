name: Input repair launch package read-only preflight
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/input-repair-launch-preflight-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: input-repair-readonly-launch-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';const r=await fetch('https://api.github.com/repos/erman-ksv/Onay-Agents-Factory/actions/runs/40518338021',{method:'GET',redirect:'error',signal:AbortSignal.timeout(10000),headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});assert.equal(r.status,200);const d=await r.json();assert.equal(d.head_sha,'de8825f2246c397d830210619030b804ae862e87');assert.equal(d.run_attempt,1);assert.equal(d.status,'completed');assert.equal(d.conclusion,'success');
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'de8825f2246c397d830210619030b804ae862e87'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Transform pinned host source without installing dependencies
        run: |
          node --input-type=module - <<'JS'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';import {stripTypeScriptTypes} from 'node:module';function compile(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())compile(p);else if(p.endsWith('.ts')&&!p.endsWith('.test.ts'))writeFileSync(p.replace(/\.ts$/,'.js'),stripTypeScriptTypes(readFileSync(p,'utf8'),{mode:'transform'}));}}for(const dir of ['agents','commander','config','github','orchestration'])compile(dir);
          JS
      - name: Verify actual carryover, root CI, bounded context and absent new state using GET only
        env:
          FACTORY_AUDIT_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
        run: node scripts/input-repair-launch-preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: input-repair-launch-preflight
          path: ${{ runner.temp }}/input-repair-launch-preflight.json
          if-no-files-found: error
          retention-days: 7
