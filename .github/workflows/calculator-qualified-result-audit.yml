name: Calculator qualified t02 result read-only audit
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.factory/calculator-qualified-result-audit-request.json']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 24fe59f2e2f8de0d732eff64e9ce45c5b523e4c2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12419478145'
          run-id: 39765383540
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-qualified-result
          merge-multiple: true
      - name: Authenticate every saved byte and inspect independent verdicts without models or writes
        run: |
          cat > "$RUNNER_TEMP/calculator-qualified-result-audit.mts" <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,readdirSync,lstatSync} from 'node:fs';
          import {join} from 'node:path';
          const {parseCalculatorExecutionCheckpointBytes}=await import(join(process.cwd(),'orchestration/calculatorExecutionCheckpoint.ts'));
          const root=join(process.env.RUNNER_TEMP!,'calculator-qualified-result'),hash=(b:Buffer|string)=>createHash('sha256').update(b).digest('hex');
          const manifest=JSON.parse(readFileSync(join(root,'qualified-manifest.json'),'utf8'));
          assert.equal(manifest.kind,'calculator-qualified-ui-forensic');assert.equal(manifest.fileCount,127);assert.equal(manifest.totalBytes,676228);assert.equal(manifest.resumeAuthorized,false);assert.equal(manifest.budgetResetAuthorized,false);assert.equal(manifest.automaticReplay,false);assert.equal(hash(JSON.stringify(manifest.files)),manifest.treeSha256);
          const paths=new Set<string>();let total=0,checkpoint:any;
          for(const f of manifest.files){assert.ok(typeof f.path==='string'&&f.path.split('/').every((p:string)=>/^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$/.test(p)&&!p.includes('..')));assert.ok(!paths.has(f.path));paths.add(f.path);const p=join(root,f.path),s=lstatSync(p);assert.ok(s.isFile()&&!s.isSymbolicLink()&&s.nlink===1);const b=readFileSync(p);assert.equal(b.length,f.bytes);assert.equal(hash(b),f.sha256);total+=b.length;if(f.path==='execution-private/calculator-pilot-step7-v1-34ee03-t02.execution.json'){assert.equal(checkpoint,undefined);const raw=JSON.parse(b.toString());checkpoint=parseCalculatorExecutionCheckpointBytes(b,raw.identity,hash(b)).data;}}
          let seen=0;function walk(path:string,prefix=''){for(const name of readdirSync(path)){const p=join(path,name),r=prefix?prefix+'/'+name:name,s=lstatSync(p);assert.ok(!s.isSymbolicLink());if(s.isDirectory())walk(p,r);else{assert.ok(r==='qualified-manifest.json'||paths.has(r));seen++;}}}walk(root);assert.equal(seen,128);assert.equal(total,676228);assert.ok(checkpoint);
          assert.equal(checkpoint.identity.taskId,'calculator-pilot-step7-v1-34ee03-t02');assert.equal(checkpoint.identity.baseSha,'5c4bc71b3119a50d2ca7ce1dbdf12bcaa000ce75');
          assert.equal(checkpoint.proposalDigest,'52971e45f59d03255a4c95712c7af8b12c5a322c8d25763e8efc8b2759e6a7b8');assert.equal(checkpoint.payload.stage,'execution_complete');assert.equal(checkpoint.payload.status,'blocked');assert.equal(checkpoint.payload.publicationStarted,false);assert.equal(checkpoint.payload.assessments.length,3);
          const report=JSON.parse(readFileSync(join(root,'calculator-report.json'),'utf8'));assert.equal(report.modelGenerationRepeated,false);assert.equal(report.oldApprovalsTransferred,false);assert.equal(report.newCharge.attemptedRequests,3);assert.equal(report.aggregateT02Charge.attemptedRequests,9);assert.equal(report.publication,undefined);
          const result={status:'qualified-result-authenticated',sourceRunId:39765383540,artifactId:12419478145,manifestSha256:hash(readFileSync(join(root,'qualified-manifest.json'))),fileCount:127,totalBytes:total,proposalDigest:checkpoint.proposalDigest,assessments:checkpoint.payload.assessments,newCharge:report.newCharge,aggregateT02Charge:report.aggregateT02Charge,modelDiagnostic:report.modelDiagnostic,httpInFlight:checkpoint.payload.httpInFlight,publicationStarted:false,modelsRun:false,githubWritesPerformed:false};
          let text=JSON.stringify(result);for(const f of checkpoint.payload.proposal.files)text=text.split(f.content).join('[complete source omitted]');assert.ok(Buffer.byteLength(text)<32768);assert.ok(!/(?:gsk_|gh[pousr]_)[A-Za-z0-9_-]{20,}/.test(text));console.log(text);

          const app=checkpoint.payload.proposal.files.find((f:any)=>f.path==='src/app.mjs').content;
          const snippets:any[]=[];for(const name of ['clearAll','updateDisplay']){const i=app.indexOf(name);assert.ok(i>=0);snippets.push({name,excerpt:app.slice(Math.max(0,i-25),Math.min(app.length,i+360))});}
          console.log(JSON.stringify({status:'bounded-clear-display-inspection',sha256:hash(app),snippets,modelCalls:0,githubWritesPerformed:false}));
          NODE
          pnpm exec tsx "$RUNNER_TEMP/calculator-qualified-result-audit.mts"
