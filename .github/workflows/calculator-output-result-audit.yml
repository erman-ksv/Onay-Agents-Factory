name: Calculator output proposal assessments and sandbox audit
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.factory/calculator-output-result-audit-request.json']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 33ed3de4cc62b04dcf10359d4b269bbd89bb62b0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12415777866'
          run-id: 39756457942
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-output-result-audit
          merge-multiple: true
      - name: Prepare pinned isolated task-check image
        run: docker --host=unix:///var/run/docker.sock pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
      - name: Authenticate all evidence and refuse the real consumed event twice without model calls
        run: |
          cat > "$RUNNER_TEMP/calculator-output-result-audit.mts" <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,readdirSync,lstatSync,mkdirSync} from 'node:fs';
          import {join} from 'node:path';
          const runtime = process.cwd();
          const {parseCalculatorExecutionCheckpointBytes} = await import(join(runtime,'orchestration/calculatorExecutionCheckpoint.ts'));
          const {inspectCalculatorStoppedSuccessor} = await import(join(runtime,'orchestration/calculatorStoppedSuccessor.ts'));
          const {inspectCalculatorPublishedTaskState,restoreCalculatorPublishedTaskState,calculatorPublishedTaskLaunch} = await import(join(runtime,'orchestration/calculatorPublishedTaskState.ts'));
          const {inspectCalculatorAfterCiEventState,restoreCalculatorAfterCiEventState} = await import(join(runtime,'orchestration/calculatorAfterCiEventState.ts'));
          const {runCalculatorAfterCi} = await import(join(runtime,'orchestration/calculatorAfterCi.ts'));
          const {CalculatorPlanStore} = await import(join(runtime,'orchestration/calculatorPlanStore.ts'));
          const root=join(process.env.RUNNER_TEMP!,'calculator-output-result-audit'),hash=(b:Buffer|string)=>createHash('sha256').update(b).digest('hex');
          const b=readFileSync(join(root,'manifest.json'));assert.equal(hash(b),'3e2575e3c55a9ee81d16cd996445de940ebb9970e7111e5e1e9309a488299abb');
          const m=JSON.parse(b.toString());assert.equal(m.kind,'calculator-output-recovery-forensic');assert.equal(m.fileCount,106);assert.equal(m.totalBytes,483598);
          assert.equal(m.resumeAuthorized,false);assert.equal(m.budgetResetAuthorized,false);assert.equal(hash(JSON.stringify(m.files)),m.treeSha256);
          const paths=new Set<string>(),capsules:any[]=[];let total=0,currentProposal:any,currentAssessments:any[]=[];
          for(const f of m.files){assert.equal(typeof f.path,'string');assert.ok(f.path.split('/').every((p:string)=>/^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$/.test(p)&&!p.includes('..')));assert.ok(!paths.has(f.path));paths.add(f.path);const p=join(root,'evidence',f.path),s=lstatSync(p);assert.ok(s.isFile()&&!s.isSymbolicLink()&&s.nlink===1);const bytes=readFileSync(p);assert.equal(bytes.length,f.bytes);assert.equal(hash(bytes),f.sha256);total+=bytes.length;
           if(/^execution-private\/[a-f0-9]{64}\/.*\.execution\.json$/.test(f.path)){const raw=JSON.parse(bytes.toString()),data=parseCalculatorExecutionCheckpointBytes(bytes,raw.identity,hash(bytes)).data;const p=data.payload;assert.equal(p.stage,'execution_complete');assert.equal(p.status,'blocked');assert.equal(p.httpInFlight,false);assert.equal(p.publicationStarted,false);assert.ok(p.proposal);assert.equal(p.assessments.length,3);currentProposal=p.proposal;currentAssessments=p.assessments;capsules.push({taskId:data.identity.taskId,modelState:p.modelState,proposalPresent:true,httpInFlight:false,publicationStarted:false,proposalDigest:data.proposalDigest,proposalFiles:p.proposal.files.map((f:any)=>({path:f.path,bytes:Buffer.byteLength(f.content),sha256:hash(f.content)})),assessments:p.assessments.map((a:any)=>({role:a.role,ready:a.ready,summary:a.summary,findings:a.findings,unverifiedAreaCount:a.unverifiedAreas.length}))});}}
          let seen=0;function walk(path:string,prefix=''){for(const name of readdirSync(path)){const p=join(path,name),rel=prefix?prefix+'/'+name:name,s=lstatSync(p);assert.ok(!s.isSymbolicLink());if(s.isDirectory())walk(p,rel);else{assert.ok(paths.has(rel));seen++;}}}walk(join(root,'evidence'));assert.equal(seen,106);assert.equal(total,483598);assert.equal(capsules.length,1);
          const {inspectCalculatorOutputRecoverySource}=await import(join(runtime,'orchestration/calculatorStoppedSuccessor.ts'));
          const previous=inspectCalculatorOutputRecoverySource(join(root,'evidence/prior-evidence'));
          const prior=inspectCalculatorPublishedTaskState(join(root,'evidence/prior-evidence/evidence/prior-evidence/evidence/prior-evidence'));
          const context=JSON.parse(readFileSync(join(root,'evidence/context.json')).toString()),remote=JSON.parse(readFileSync(join(root,'evidence/barrier/remote.json')).toString());
          assert.equal(remote.artifactId,12416635148);assert.equal(remote.artifactDigest,'sha256:0dfc06dea50e45d88a7fc9961518abcf48310cbf9c2c902ffbe4469f20898a48');assert.equal(remote.manifestSha256,'cb49f1e629ab61a2474a09b880be27492df52fb101e28508470d7e2a19fe36ce');assert.equal(remote.manifestSha256,context.admission.manifestSha256);
          const report=JSON.parse(readFileSync(join(root,'evidence/calculator-report.json')).toString());assert.equal(report.status,'blocked');assert.equal(report.taskId,previous.taskId);assert.equal(report.reasonCode,'repair_limit_reached');assert.equal(report.publication,undefined);assert.equal(report.proposalTestsExecuted,false);assert.equal(report.candidateTestsExecuted,false);assert.deepEqual(m.previousCharges,context.request.previousCharges);assert.deepEqual(m.previousCharges.stoppedSuccessor,previous.firstCharge);assert.deepEqual(m.previousCharges.stoppedRecovery,previous.secondCharge);assert.equal(capsules[0].taskId,previous.taskId);assert.equal(capsules[0].modelState.attemptedRequests,4);
          const local=join(process.env.RUNNER_TEMP!,'calculator-output-duplicate-proof');mkdirSync(local,{mode:0o700});
          const state=join(local,'state'),event=join(local,'event');restoreCalculatorPublishedTaskState(prior,state);
          const barrier=inspectCalculatorAfterCiEventState(join(root,'evidence/confirmed-event'),{request:context.transition,origin:context.origin,manifestSha256:remote.manifestSha256});restoreCalculatorAfterCiEventState(barrier,event);
          const before=new Map(readdirSync(event).map((n:string)=>[n,readFileSync(join(event,n))]));let toolsCalled=0;
          const deny=async()=>{toolsCalled++;throw Error('duplicate_must_stop_before_tools');},launch=calculatorPublishedTaskLaunch(prior);
          const reader={getHead:deny,readCommit:deny,readTree:deny,readBlob:deny},options={eventDirectory:event,ci:deny,verifyDependencies:deny,execution:{execution:'offline-test',maxRepairs:0,team:{generate:deny,repair:deny,assess:deny},tools:{checkProposal:deny,publish:deny,ci:deny}}};
          for(let attempt=0;attempt<2;attempt++){const result=await runCalculatorAfterCi(new CalculatorPlanStore(state,launch.goal),reader,context.transition,options);assert.equal(result.reasonCode,'after_ci_event_already_recorded_no_replay');assert.equal(result.execution,undefined);}
          assert.equal(toolsCalled,0);for(const [n,bytes] of before)assert.deepEqual(readFileSync(join(event,n)),bytes);
          const {createCalculatorSandbox}=await import(join(runtime,'orchestration/calculatorSandbox.ts'));
          const {calculatorProposalDigest}=await import(join(runtime,'orchestration/calculatorExecutionEvidence.ts'));
          const firstRoot=join(root,'evidence/prior-evidence/evidence/prior-evidence/evidence/prior-evidence/evidence');
          const baseSources=new Map<string,string>();
          for(const directory of readdirSync(join(firstRoot,'execution-private'))){const d=join(firstRoot,'execution-private',directory);if(!lstatSync(d).isDirectory())continue;for(const name of readdirSync(d)){if(!name.endsWith('-t01.execution.json'))continue;const raw=JSON.parse(readFileSync(join(d,name)).toString());const p=parseCalculatorExecutionCheckpointBytes(readFileSync(join(d,name)),raw.identity).data.payload;assert.equal(p.publicationStarted,true);for(const f of p.proposal.files)baseSources.set(f.path,f.content);}}
          assert.equal(baseSources.size,2);
          const checker=createCalculatorSandbox({image:'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392',baseSha:currentProposal.baseSha,baseSources});
          const plan=new CalculatorPlanStore(state,launch.goal).inspect(),task=plan.tasks.find((t:any)=>t.id===previous.taskId);assert.ok(task);
          const hostProof=await checker.checkProposal({task,changes:currentProposal,proposalDigest:calculatorProposalDigest(currentProposal)});assert.ok(['passed','failed','unverified'].includes(hostProof.status));assert.equal(hostProof.testsExecuted,hostProof.status!=='unverified');
          const newCharge=capsules[0].modelState,aggregate=Object.fromEntries(Object.keys(previous.aggregateT02Charge).map(k=>[k,previous.aggregateT02Charge[k]+newCharge[k]]));
          const result={status:'output-recovery-assessments-and-tests-verified',runId:39756457942,artifactId:12415777866,manifestSha256:hash(b),fileCount:seen,totalBytes:total,priorChargesPreserved:true,previousCharge:previous.aggregateT02Charge,newCapsules:capsules,aggregateT02Charge:aggregate,hostProof,barrierPersistedAndAcknowledged:true,realConsumedEventRestored:true,duplicateRefused:true,restartRefused:true,toolsCalled,modelsRun:false,githubWritesPerformed:false,privateCopiesCreated:true,resumeAuthorized:false,budgetResetAuthorized:false};
          let output=JSON.stringify(result);for(const f of currentProposal.files)if(f.content)output=output.split(f.content).join("[source quotation omitted]");assert.ok(Buffer.byteLength(output)<32768);assert.ok(!/(?:gsk_|gh[pousr]_)[A-Za-z0-9_-]{20,}/.test(output));console.log(output);
          NODE
          pnpm exec tsx "$RUNNER_TEMP/calculator-output-result-audit.mts"
