name: Calculator saved t03 correction independent reviews
on:
  push:
    branches: ['feat/calculator-t02-charge-reconcile-20261022']
    paths: ['.factory/calculator-t03-owner-reviews-request.json']
# Explicit host-only scope: Factory writes only metadata objects and an atomic state reference.
permissions:
  contents: write
  actions: read
concurrency:
  group: calculator-protected-live-plan-step7
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: request
          sparse-checkout: .factory/calculator-t03-owner-reviews-request.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the fixed host request
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const value=JSON.parse(readFileSync('request/.factory/calculator-t03-owner-reviews-request.json','utf8'));
          assert.deepEqual(value,{"version":1,"allowanceId":"owner-approved-t03-correction-2-20261023","runtimeSha":"b8fe5112dc20ae4a426d56fd0c905bb2c22b75c1","sourceCiRunId":39977967494,"taskId":"calculator-pilot-step7-v1-34ee03-t03","sourceCapsuleSha256":"0f99168fbc2dfa98aad2b378ee4b36a5440e51ac5721d14c2cd8d930707ebbf7","priorFailedRunId":39966515860,"priorFailedReportSha256":"63b2c524dc65074a455e061db1e614081e2eec8f8b2f6a61fb5ecb05b39e25df","priorRequests":6,"maxNewRequests":3,"maxTotalT03Requests":9,"maxTotalT03ReservedTokens":34000,"maxFurtherRepairs":0,"automaticReplay":false,"legalEnabled":false,"maxNewAuthorRequests":0,"savedAgentResponseRunId":39973872603,"savedAgentResponseSha256":"cb1f22efc82523cca64e086da10ac7c455d4d5c799c079a9ba774ce9961eb2dd"});
          JS
      - name: Checkout immutable live runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b8fe5112dc20ae4a426d56fd0c905bb2c22b75c1
          path: runtime
          persist-credentials: false
      - name: Download exact stopped t03 evidence without execution
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12497425333'
          run-id: '39942417242'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-prior
          merge-multiple: true
      - name: Download exact zero-HTTP context-stop proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12499003755'
          run-id: '39949567538'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-context-stop
          merge-multiple: true
      - name: Download prior rejected correction report without replay
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12507835270'
          run-id: '39966515860'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-last-repair
          merge-multiple: true
      - name: Download exact saved agent correction without another author request
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12509264527'
          run-id: '39973872603'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-t03-owner-reply
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install trusted runtime dependencies
        working-directory: runtime
        run: pnpm install --frozen-lockfile
      - name: Prepare exact isolated runtime images
        run: |
          docker --host=unix:///var/run/docker.sock pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
          docker --host=unix:///var/run/docker.sock pull 'mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a'
      - name: Verify saved agent correction then run three fresh independent reviews
        working-directory: runtime
        env:
          CALCULATOR_T03_REPAIR_APPROVED: FINISH_OWNER_CYCLE_2_THREE_REVIEWS_NO_AUTHOR_REPLAY
          CALCULATOR_T03_EVIDENCE_DIRECTORY: ${{ runner.temp }}/calculator-t03-prior
          CALCULATOR_T03_CONTEXT_STOP_DIRECTORY: ${{ runner.temp }}/calculator-t03-context-stop
          CALCULATOR_T03_LAST_REPAIR_DIRECTORY: ${{ runner.temp }}/calculator-t03-last-repair
          CALCULATOR_T03_OWNER_REPLY_DIRECTORY: ${{ runner.temp }}/calculator-t03-owner-reply
          FACTORY_RUNTIME_SHA: b8fe5112dc20ae4a426d56fd0c905bb2c22b75c1
          FACTORY_SOURCE_CI_RUN: '39977967494'
          FACTORY_STATE_TOKEN: ${{ github.token }}
          CALCULATOR_GITHUB_TOKEN: ${{ secrets.CALCULATOR_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CALCULATOR_EXECUTION_LIVE_APPROVED: RUN_ONE_FREE_CALCULATOR_TASK
          CALCULATOR_MODEL_LIVE_APPROVED: ONE_FREE_BOUNDED_RUN
          ONAY_TEAM_FREE_TIER_CONFIRMED: 'true'
          AGENT_FACTORY_TARGET_PROFILE: calculator
          AGENT_ALLOWED_REPOSITORIES: erman-ksv/Onay-Factory-Calculator
          AGENT_FACTORY_PROVIDER: groq
          AGENT_FACTORY_LEGAL_ENABLED: 'false'
          AGENT_FACTORY_ALLOW_WORKFLOW_CHANGES: 'false'
          AGENT_FACTORY_ENABLE_GITHUB_WRITES: 'true'
        run: pnpm exec tsx scripts/calculator-t03-owner-reviews.mjs
      - name: Preserve immutable evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-t03-owner-reviews-${{ github.run_id }}
          path: ${{ runner.temp }}/calculator-t03-owner-reviews/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
