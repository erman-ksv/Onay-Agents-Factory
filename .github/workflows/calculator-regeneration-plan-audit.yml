name: Calculator regeneration fixed plan read-only audit
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.github/workflows/calculator-regeneration-plan-audit.yml', 'scripts/calculator-regeneration-plan-audit.mjs']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/calculator-regeneration-plan-audit.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12276359076'
          run-id: 39448498604
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-regeneration-plan-audit
          merge-multiple: true
      - name: Read only the fixed saved plan for regression evidence
        run: node scripts/calculator-regeneration-plan-audit.mjs "$RUNNER_TEMP/calculator-regeneration-plan-audit"
