name: Calculator saved t02 one-import repair browser audit
on:
  push:
    branches: ['feat/calculator-step7-regeneration-20261020']
    paths: ['.factory/calculator-output-repair-browser-audit-request.json']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 33ed3de4cc62b04dcf10359d4b269bbd89bb62b0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12415777866'
          run-id: 39756457942
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/calculator-output-result-audit
          merge-multiple: true
      - name: Prepare pinned isolated task-check image
        run: docker --host=unix:///var/run/docker.sock pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
      - name: Authenticate all evidence and refuse the real consumed event twice without model calls
        run: |
          cat > "$RUNNER_TEMP/calculator-output-repair-browser-audit.mts" <<'NODE'
